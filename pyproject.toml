[project]
name = "authcenter"
version = "0.1.0"
description = "FastAPI backend for AuthCenter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "CPY001", "COM812", "ANN401", "RUF001", "RUF002", "RUF003"]
